name: QA checks

on:
  workflow_call:

# Permissions should be configured at the job level.
permissions: {}

jobs:
  pinact:
    permissions:
      contents: read # To clone the repo.

    name: 'Run Pinact'
    uses: PHPCSStandards/.github/.github/workflows/reusable-pinact.yml@559f40470dbce9f7faeab31f82c0be7dfb93228e # v1.3.0

  xmllint:
    permissions:
      contents: read # To clone the repo.

    name: 'Check XML'
    runs-on: ubuntu-latest

    env:
      XMLLINT_INDENT: '    '

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: 'latest'
          coverage: none

      # Install dependencies to make sure the PHPCS XSD file is available.
      - name: Install dependencies
        run: composer install --no-dev --no-interaction --no-progress

      - name: Validate Ruleset XML file against schema
        uses: phpcsstandards/xmllint-validate@5189514594c8d5f4cf21b7e5af50f54d697973d7 # v2.0.0
        with:
          pattern: "./*/ruleset.xml"
          xsd-file: "vendor/squizlabs/php_codesniffer/phpcs.xsd"

      # Check the code-style consistency of the xml files.
      # Note: this needs xmllint, but that will be installed via the phpcsstandards/xmllint-validate action runner.
      - name: Check code style
        run: |
          diff -B ./PHPCompatibilitySymfonyPolyfillPHP54/ruleset.xml <(xmllint --format "./PHPCompatibilitySymfonyPolyfillPHP54/ruleset.xml")
          diff -B ./PHPCompatibilitySymfonyPolyfillPHP55/ruleset.xml <(xmllint --format "./PHPCompatibilitySymfonyPolyfillPHP55/ruleset.xml")
          diff -B ./PHPCompatibilitySymfonyPolyfillPHP56/ruleset.xml <(xmllint --format "./PHPCompatibilitySymfonyPolyfillPHP56/ruleset.xml")
          diff -B ./PHPCompatibilitySymfonyPolyfillPHP70/ruleset.xml <(xmllint --format "./PHPCompatibilitySymfonyPolyfillPHP70/ruleset.xml")
          diff -B ./PHPCompatibilitySymfonyPolyfillPHP71/ruleset.xml <(xmllint --format "./PHPCompatibilitySymfonyPolyfillPHP71/ruleset.xml")
          diff -B ./PHPCompatibilitySymfonyPolyfillPHP72/ruleset.xml <(xmllint --format "./PHPCompatibilitySymfonyPolyfillPHP72/ruleset.xml")
          diff -B ./PHPCompatibilitySymfonyPolyfillPHP73/ruleset.xml <(xmllint --format "./PHPCompatibilitySymfonyPolyfillPHP73/ruleset.xml")
          diff -B ./PHPCompatibilitySymfonyPolyfillPHP74/ruleset.xml <(xmllint --format "./PHPCompatibilitySymfonyPolyfillPHP74/ruleset.xml")
          diff -B ./PHPCompatibilitySymfonyPolyfillPHP80/ruleset.xml <(xmllint --format "./PHPCompatibilitySymfonyPolyfillPHP80/ruleset.xml")
          diff -B ./PHPCompatibilitySymfonyPolyfillPHP81/ruleset.xml <(xmllint --format "./PHPCompatibilitySymfonyPolyfillPHP81/ruleset.xml")
          diff -B ./PHPCompatibilitySymfonyPolyfillPHP82/ruleset.xml <(xmllint --format "./PHPCompatibilitySymfonyPolyfillPHP82/ruleset.xml")
          diff -B ./PHPCompatibilitySymfonyPolyfillPHP83/ruleset.xml <(xmllint --format "./PHPCompatibilitySymfonyPolyfillPHP83/ruleset.xml")
          diff -B ./PHPCompatibilitySymfonyPolyfillPHP84/ruleset.xml <(xmllint --format "./PHPCompatibilitySymfonyPolyfillPHP84/ruleset.xml")
          diff -B ./PHPCompatibilitySymfonyPolyfillPHP85/ruleset.xml <(xmllint --format "./PHPCompatibilitySymfonyPolyfillPHP85/ruleset.xml")

  test-polyfills-119:
    permissions:
      contents: read # To clone the repo.

    needs: xmllint

    strategy:
      matrix:
        # This matrix should reflect the polyfill packages provided in the v1.19 version of the Polyfill package.
        #
        # Originally the Symfony polyfills supported PHP >= 5.3.3 (tested via PHP 5.4 as setup-php doesn't install PHP 5.3).
        # The polyfills need to be installed at v 1.19 (last before the version drop) to test the rulesets in this
        # package are complete and correct.
        # The v1.19 version also includes a polyfill for PHP 8.0 with a minimum PHP requirement of PHP 7.0.
        php: ['5.4', 'latest']
        phpcompat: ['stable', 'dev-develop']
        polyfillphp: ['54', '55', '56', '70', '71', '72', '73', '74']

        # Testing the rulesets only against PHPCompatibility `dev-develop` with PHP `latest` is sufficient.
        # No need to test PHPCompatibility itself.
        exclude:
          - php: '5.4'
            phpcompat: 'dev-develop'

        include:
          - php: '7.0'
            phpcompat: 'stable'
            polyfillphp: '80'
          - php: 'latest'
            phpcompat: 'stable'
            polyfillphp: '80'
          - php: 'latest'
            phpcompat: 'dev-develop'
            polyfillphp: '80'

    continue-on-error: ${{ matrix.phpcompat != 'stable' }}

    name: "Polyfill-php${{ matrix.polyfillphp }} v1.19: PHP ${{ matrix.php }} - PHPCompat ${{ matrix.phpcompat }}"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          ini-values: error_reporting=E_ALL, display_errors=On, display_startup_errors=On
          coverage: none
        env:
          fail-fast: true

        # Remove all polyfill requirements and just focus on the one package per run.
        # Prevents the autoloading of the polyfill bootstrap file via Composer from generating
        # a parse error depending on the PHP version (and blocking the DealerDirect plugin
        # from setting the installed_paths for PHPCS).
      - name: "Remove all polyfill packages not required at v1.19"
        run: >
          composer remove --dev --no-update --no-scripts --no-interaction
          symfony/polyfill-php72
          symfony/polyfill-php73
          symfony/polyfill-php74
          symfony/polyfill-php80
          symfony/polyfill-php81
          symfony/polyfill-php82
          symfony/polyfill-php83
          symfony/polyfill-php84
          symfony/polyfill-php85

      - name: "Require specific version of the polyfill under test"
        run: composer require --dev --no-update --no-interaction symfony/polyfill-php${{ matrix.polyfillphp }}:"1.19"

      - name: Conditionally update PHPCompatibility to develop version
        if: ${{ matrix.phpcompat != 'stable' }}
        run: |
          composer config minimum-stability dev
          composer require --no-update phpcompatibility/php-compatibility:"${{ matrix.phpcompat }}" --no-interaction

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # Make sure that known polyfills don't trigger any errors.
      - name: Test the ruleset
        run: >
          vendor/bin/phpcs -ps ./Test/SymfonyPolyfillPHP${{ matrix.polyfillphp }}Test.php
          --standard=PHPCompatibilitySymfonyPolyfillPHP${{ matrix.polyfillphp }}
          --exclude=PHPCompatibility.Upgrade.LowPHP
          --runtime-set testVersion ${{ matrix.polyfillphp != '80' && '5.3-' || '7.0-' }}

      # Check that the ruleset doesn't throw unnecessary errors for code in the polyfill package itself.
      - name: "Test running against the polyfill${{ matrix.polyfillphp }} package"
        # No need to run this on multiple PHP versions, but we do want to run it against PHPCompat stable + dev.
        if: ${{ matrix.php != '5.4' && matrix.php != '7.0' }}
        run: >
          vendor/bin/phpcs -ps ./vendor/symfony/polyfill-php${{ matrix.polyfillphp }}/
          ${{ matrix.polyfillphp == '56' && './vendor/symfony/polyfill-util/' || '' }}
          --standard=PHPCompatibilitySymfonyPolyfillPHP${{ matrix.polyfillphp }}
          --exclude=PHPCompatibility.Upgrade.LowPHP
          ${{ matrix.polyfillphp == '56' && '--ignore=*/polyfill-util/TestListener*' || '' }}
          --runtime-set testVersion ${{ matrix.polyfillphp != '80' && '5.3-' || '7.0-' }}

  test-polyfills-130:
    permissions:
      contents: read # To clone the repo.

    needs: xmllint
    strategy:
      matrix:
        # This matrix should reflect the polyfill packages provided in the v1.30 version of the Polyfill package.
        #
        # As of version v 1.20, the Symfony polyfills have a minimum PHP requirement of >= 7.1.
        # The next PHP version drop will be in v 1.31.
        # So, the polyfills need to be installed at v 1.30 (last before the version drop) to further test the rulesets
        # in this package are complete and correct.
        php: ['7.1', 'latest']
        phpcompat: ['stable', 'dev-develop']
        polyfillphp: ['72', '73', '74', '80', '81', '82', '83', '84']

        # Testing the rulesets only against PHPCompatibility `dev-develop` with PHP `latest` is sufficient.
        # No need to test PHPCompatibility itself.
        exclude:
          - php: '7.1'
            phpcompat: 'dev-develop'

    continue-on-error: ${{ matrix.phpcompat != 'stable' }}

    name: "Polyfill-php${{ matrix.polyfillphp }} v1.30: PHP ${{ matrix.php }} - PHPCompat ${{ matrix.phpcompat }}"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          ini-values: error_reporting=E_ALL, display_errors=On, display_startup_errors=On
          coverage: none
        env:
          fail-fast: true

        # Remove all polyfill requirements and just focus on the one package per run.
        # Prevents the autoloading of the polyfill bootstrap file via Composer from generating
        # a parse error depending on the PHP version (and blocking the DealerDirect plugin
        # from setting the installed_paths for PHPCS).
      - name: "Remove all polyfill packages not required at v1.30"
        run: >
          composer remove --dev --no-update --no-scripts --no-interaction
          symfony/polyfill-php54
          symfony/polyfill-php55
          symfony/polyfill-php56
          symfony/polyfill-php70
          symfony/polyfill-php71
          symfony/polyfill-php73
          symfony/polyfill-php74
          symfony/polyfill-php80
          symfony/polyfill-php81
          symfony/polyfill-php82
          symfony/polyfill-php83
          symfony/polyfill-php84
          symfony/polyfill-php85

      - name: "Require specific version of the polyfill under test"
        run: composer require --dev --no-update --no-interaction symfony/polyfill-php${{ matrix.polyfillphp }}:"1.30"

      - name: Conditionally update PHPCompatibility to develop version
        if: ${{ matrix.phpcompat != 'stable' }}
        run: |
          composer config minimum-stability dev
          composer require --no-update phpcompatibility/php-compatibility:"${{ matrix.phpcompat }}" --no-interaction

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # Make sure that known polyfills don't trigger any errors.
      - name: Test the ruleset
        run: >
          vendor/bin/phpcs -ps ./Test/SymfonyPolyfillPHP${{ matrix.polyfillphp }}Test.php
          --standard=PHPCompatibilitySymfonyPolyfillPHP${{ matrix.polyfillphp }}
          --exclude=PHPCompatibility.Upgrade.LowPHP
          --runtime-set testVersion 7.1-

      # Check that the ruleset doesn't throw unnecessary errors for code in the polyfill package itself.
      - name: "Test running against the polyfill${{ matrix.polyfillphp }} package"
        # No need to run this on multiple PHP versions, but we do want to run it against PHPCompat stable + dev.
        # Also: The PHP 8.3 polyfills at version 1.30 are not tested as they are not in actual fact compatible with
        # PHP 7.1. This was correctly detected by PHPCompatibility and would otherwise cause this test to fail.
        if: ${{ matrix.php != '7.1' && matrix.polyfillphp != '83' }}
        run: >
          vendor/bin/phpcs -ps ./vendor/symfony/polyfill-php${{ matrix.polyfillphp }}/
          --standard=PHPCompatibilitySymfonyPolyfillPHP${{ matrix.polyfillphp }}
          --exclude=PHPCompatibility.Upgrade.LowPHP
          --runtime-set testVersion 7.1-

  test-polyfills-current:
    permissions:
      contents: read # To clone the repo.

    needs: xmllint
    strategy:
      matrix:
        # This matrix should reflect the polyfill packages provided in the latest version of the Polyfill package.
        #
        # As of version v 1.31, the Symfony polyfills have a minimum PHP requirement of >= 7.2.
        # This was the last PHP version drop until "now".
        # So, the polyfills need to be installed at the latest version/dev-version to further test the rulesets
        # in this package are complete and correct.
        php: ['7.2', 'latest']
        phpcompat: ['stable', 'dev-develop']
        polyfillphp: ['73', '74', '80', '81', '82', '83', '84', '85']

        # Testing the rulesets only against PHPCompatibility `dev-develop` with PHP `latest` is sufficient.
        # No need to test PHPCompatibility itself.
        exclude:
          - php: '7.2'
            phpcompat: 'dev-develop'

    continue-on-error: ${{ matrix.phpcompat != 'stable' }}

    name: "Polyfill-php${{ matrix.polyfillphp }} current: PHP ${{ matrix.php }} - PHPCompat ${{ matrix.phpcompat }}"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          ini-values: error_reporting=E_ALL, display_errors=On, display_startup_errors=On
          coverage: none
        env:
          fail-fast: true

      - name: Conditionally update PHPCompatibility to develop version
        if: ${{ matrix.phpcompat != 'stable' }}
        run: |
          composer config minimum-stability dev
          composer require --no-update phpcompatibility/php-compatibility:"${{ matrix.phpcompat }}" --no-interaction

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # Make sure that known polyfills don't trigger any errors.
      - name: Test the ruleset
        run: >
          vendor/bin/phpcs -ps ./Test/SymfonyPolyfillPHP${{ matrix.polyfillphp }}Test.php
          --standard=PHPCompatibilitySymfonyPolyfillPHP${{ matrix.polyfillphp }}
          --exclude=PHPCompatibility.Upgrade.LowPHP
          --runtime-set testVersion 7.2-

      # Check that the ruleset doesn't throw unnecessary errors for code in the polyfill package itself.
      - name: "Test running against the polyfill${{ matrix.polyfillphp }} package"
        # No need to run this on multiple PHP versions, but we do want to run it against PHPCompat stable + dev.
        if: ${{ matrix.php != '7.2' }}
        run: >
          vendor/bin/phpcs -ps ./vendor/symfony/polyfill-php${{ matrix.polyfillphp }}/
          --standard=PHPCompatibilitySymfonyPolyfillPHP${{ matrix.polyfillphp }}
          --exclude=PHPCompatibility.Upgrade.LowPHP
          --runtime-set testVersion 7.2-
